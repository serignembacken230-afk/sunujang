<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E5A47">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="icons/icon.svg"><link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png"><link rel="apple-touch-icon" href="icons/icon-180.png"><meta name="apple-mobile-web-app-title" content="Sunu Jàng"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Sunu Jàng 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --baobab:#0E5A47; --baobab-2:#0A4536; --baobab-soft:#E3F0EA;
  --mango:#F4A62A; --mango-soft:#FDF0D8;
  --bissap:#9B1D4A; --bissap-soft:#F7E3EA;
  --ocean:#2A7DB8; --ocean-soft:#E2EEF7;
  --ink:#1A1F2B; --ink-2:#4A5262; --ink-3:#7A8292;
  --paper:#F6F7F4; --card:#FFFFFF; --line:#E3E6E0;
  --ok:#1E8A4C; --warn:#C26A00; --bad:#C0392B;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --fs:1;
  --display:'Bricolage Grotesque', system-ui, sans-serif;
  --body:'Atkinson Hyperlegible', system-ui, sans-serif;
}
html.contrast{
  --paper:#FFFFFF; --card:#FFFFFF; --line:#1A1F2B; --ink-2:#1A1F2B; --ink-3:#2E3442;
  --baobab:#00402F; --baobab-soft:#D6EBE1; --bissap:#7A0F35; --ocean:#0B4F80;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(16px * var(--fs));-webkit-text-size-adjust:100%}
body{font-family:var(--body);color:var(--ink);background:#DCE3DE;line-height:1.45;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--mango);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* phone frame on desktop, full screen on mobile */
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top)}
@media (min-width:600px){body{padding:24px 0}.app{min-height:calc(100vh - 48px);border-radius:28px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(14,90,71,.35)}}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:14px 18px 8px}
.top .who{flex:1;min-width:0}
.top .hello{font-family:var(--display);font-weight:700;font-size:1.2rem;line-height:1.15;letter-spacing:-.01em}
.top .sub{color:var(--ink-3);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none;position:relative}
.iconbtn .dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--bissap);border:2px solid var(--card)}
.net{font-size:.75rem;padding:4px 9px;border-radius:99px;background:var(--baobab-soft);color:var(--baobab);font-weight:700;display:flex;gap:5px;align-items:center}
.net.off{background:var(--mango-soft);color:var(--warn)}
.net i{width:7px;height:7px;border-radius:50%;background:currentColor}

main{flex:1;padding:6px 18px 110px;overflow-x:hidden}
.sec-title{font-family:var(--display);font-weight:700;font-size:1.1rem;margin:22px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-title small{font-family:var(--body);font-weight:400;font-size:.85rem;color:var(--ink-3)}
.link{color:var(--baobab);font-weight:700;font-size:.9rem;padding:6px 0}

/* bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:flex;padding:6px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
@media (min-width:600px){.nav{bottom:24px;border-radius:0 0 28px 28px}}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:.72rem;color:var(--ink-3);border-radius:14px;min-height:54px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--baobab);font-weight:700}
.nav button.on .pill{background:var(--baobab-soft)}
.nav .pill{padding:3px 16px;border-radius:99px;display:grid;place-items:center;transition:background .2s}

/* cards & lists */
.card{background:var(--card);border-radius:var(--r-lg);padding:16px;border:1px solid var(--line)}
.stack>*+*{margin-top:10px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--ink-3);font-size:.88rem}
.list{background:var(--card);border-radius:var(--r-lg);border:1px solid var(--line);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left;min-height:60px}
.item+.item{border-top:1px solid var(--line)}
.item .t{font-weight:700}
.item .chev{color:var(--ink-3);width:18px;height:18px;flex:none}
.mono{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;flex:none;font-size:1rem}
.badge{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--paper);color:var(--ink-2);white-space:nowrap}
.badge.ok{background:#DDF2E5;color:var(--ok)}.badge.bad{background:#F8E0DD;color:var(--bad)}.badge.warn{background:var(--mango-soft);color:var(--warn)}.badge.lock{background:var(--bissap-soft);color:var(--bissap)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:99px;font-weight:700;background:var(--baobab);color:#fff;font-size:1rem}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.ghost{background:var(--card);color:var(--baobab);border:1.5px solid var(--baobab)}
.btn.mango{background:var(--mango);color:var(--ink)}
.btn.small{min-height:40px;padding:0 14px;font-size:.9rem}
.btn.danger{background:var(--card);color:var(--bad);border:1.5px solid #E7B9B3}
.btn svg{width:20px;height:20px}
.btns{display:flex;gap:10px;flex-wrap:wrap}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin:0 -18px;padding-left:18px;padding-right:18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 15px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:.9rem;min-height:42px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* signature: the wax hero */
.hero{border-radius:26px;background:var(--baobab);color:#fff;padding:20px;position:relative;overflow:hidden}
.hero .wax{position:absolute;inset:0;opacity:.4;pointer-events:none}
.hero>*:not(.wax){position:relative}
.hero h2{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.05;letter-spacing:-.02em;max-width:15ch}
.hero p{opacity:.9;margin-top:6px;max-width:30ch}
.hero .btn{background:var(--mango);color:var(--ink);margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:rgba(255,255,255,.12);border-radius:16px;padding:10px 12px}
.stat b{font-family:var(--display);font-size:1.45rem;display:block;line-height:1.1}
.stat span{font-size:.75rem;opacity:.85}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}
.kpi b{font-family:var(--display);font-size:1.8rem;line-height:1;display:block;margin-top:6px}
.kpi span{font-size:.82rem;color:var(--ink-3)}
.bar{height:8px;border-radius:99px;background:var(--paper);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--baobab);border-radius:99px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:118px}
.tile .t{font-weight:700;line-height:1.2}

/* forms */
label.f{display:block;font-weight:700;font-size:.9rem;margin:14px 0 6px}
.input{width:100%;min-height:52px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--card);padding:0 14px;font-size:1rem}
textarea.input{padding:12px 14px;min-height:96px;resize:vertical}
.input:focus{border-color:var(--baobab);outline:none}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border-radius:99px;font-weight:700;font-size:.9rem;color:var(--ink-2)}
.seg button.on{background:var(--baobab);color:#fff}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,25,20,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--paper);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease-out}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-family:var(--display);font-size:1.4rem;line-height:1.15;margin-bottom:4px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);width:max-content;background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;max-width:90%;animation:up .2s;display:flex;gap:8px;align-items:center}

/* lesson */
.lesson h4{font-family:var(--display);font-size:1.15rem;margin:18px 0 6px}
.lesson p,.lesson li{margin-top:6px}
.lesson ul,.lesson ol{padding-left:22px}
.lesson .box{background:var(--mango-soft);border-radius:var(--r-md);padding:12px 14px;margin-top:12px}
.lesson .ex{background:var(--ocean-soft);border-radius:var(--r-md);padding:12px 14px;margin-top:12px}
.speak{display:inline-flex;align-items:center;gap:6px;background:var(--baobab-soft);color:var(--baobab);font-weight:700;padding:8px 14px;border-radius:99px;font-size:.9rem;min-height:40px}
.speak svg{width:18px;height:18px}

/* quiz */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.qprog{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.qprog i{display:block;height:100%;background:var(--mango);transition:width .3s}
.q{font-family:var(--display);font-size:1.45rem;font-weight:700;line-height:1.2;margin:8px 0 18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;min-height:62px;font-size:1.05rem;margin-bottom:10px}
.opt .k{width:34px;height:34px;border-radius:10px;background:var(--paper);display:grid;place-items:center;font-weight:700;flex:none}
.opt.good{border-color:var(--ok);background:#E9F6EE}.opt.good .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:#FBECEA}.opt.wrong .k{background:var(--bad);color:#fff}
.explain{border-radius:16px;padding:14px;margin-top:4px}
.explain.good{background:#E9F6EE}.explain.wrong{background:#FBECEA}
.score{font-family:var(--display);font-size:4.5rem;font-weight:800;line-height:1;color:var(--baobab)}

/* roll call */
.roll{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:64px}
.roll+.roll{border-top:1px solid var(--line)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--baobab-soft);color:var(--baobab);flex:none;font-size:.95rem}
.tri{display:flex;gap:6px}
.tri button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);font-weight:800;font-size:.95rem;background:var(--card)}
.tri button.p.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tri button.a.on{background:var(--bad);border-color:var(--bad);color:#fff}
.tri button.r.on{background:var(--mango);border-color:var(--mango);color:var(--ink)}
.noteIn{width:76px;min-height:46px;text-align:center;border-radius:12px;border:1.5px solid var(--line);font-size:1.1rem;font-weight:700;background:var(--card)}
.noteIn:focus{border-color:var(--baobab);outline:none}

/* welcome */
.welcome{background:var(--baobab);color:#fff;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.welcome .wax{position:absolute;inset:0;opacity:.55}
.welcome .inner{position:relative;padding:28px 22px 30px;display:flex;flex-direction:column;flex:1}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.2rem}
.brand .logo{width:42px;height:42px;border-radius:13px;background:var(--mango);display:grid;place-items:center;color:var(--baobab)}
.welcome h1{font-family:var(--display);font-weight:800;font-size:3.1rem;line-height:.95;letter-spacing:-.03em;margin-top:auto;padding-top:40px}
.welcome .lead{font-size:1.1rem;opacity:.92;margin-top:12px;max-width:28ch}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px}
.role{background:#fff;color:var(--ink);border-radius:22px;padding:16px;text-align:left;min-height:128px;display:flex;flex-direction:column;justify-content:space-between}
.role svg{width:30px;height:30px;color:var(--baobab)}
.role b{font-family:var(--display);font-size:1.15rem;display:block}
.role span{font-size:.82rem;color:var(--ink-3)}
.langs{display:flex;gap:6px;margin-top:18px}
.langs button{padding:8px 14px;border-radius:99px;border:1.5px solid rgba(255,255,255,.5);color:#fff;font-weight:700;font-size:.9rem}
.langs button.on{background:#fff;color:var(--baobab);border-color:#fff}

.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.levels button{min-height:52px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-weight:700}
.levels button.on{background:var(--baobab);color:#fff;border-color:var(--baobab)}
.cycle{font-size:.85rem;color:var(--ink-3);margin:12px 0 6px;font-weight:700}

.bubble{max-width:82%;padding:10px 14px;border-radius:18px;margin-top:8px}
.bubble.me{background:var(--baobab);color:#fff;margin-left:auto;border-bottom-right-radius:6px}
.bubble.them{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.bubble small{display:block;opacity:.7;font-size:.72rem;margin-top:3px}

.table{width:100%;border-collapse:collapse;font-size:.92rem}
.table th{text-align:left;font-size:.78rem;color:var(--ink-3);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line)}
.table td{padding:10px 6px;border-bottom:1px solid var(--line)}
.table td.n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.month{border-radius:14px;padding:10px;border:1.5px solid var(--line);background:var(--card);text-align:left;min-height:62px}
.month b{display:block;font-size:.9rem}
.month.paid{background:#E9F6EE;border-color:#BFE3CC}
.month.due{border-color:var(--mango);background:var(--mango-soft)}

.ring{--p:60;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--mango) calc(var(--p)*1%), rgba(255,255,255,.18) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--baobab);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.empty{text-align:center;padding:28px 16px;color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.locked{position:relative}
.spacer{height:14px}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
/* arabe */
.ar,[lang=ar]{font-family:'Noto Naskh Arabic','Amiri',serif;direction:rtl;unicode-bidi:isolate}
.lesson .ar{display:block;text-align:right;font-size:1.4em;line-height:2;margin-top:8px}
.lesson .tr{display:block;color:var(--ink-2);font-size:.95em;margin-top:2px}
.lesson .verse{background:var(--baobab-soft);border-radius:var(--r-md);padding:14px 16px;margin-top:12px;text-align:center}
.lesson .verse .ar{text-align:center;font-size:1.6em}
.lesson table{width:100%;border-collapse:collapse;margin-top:10px}
.lesson td{padding:8px 6px;border-bottom:1px solid var(--line)}
.lesson td.ar{font-size:1.3em;text-align:right;display:table-cell}
.mono.arm{font-family:'Noto Naskh Arabic',serif;font-weight:700;font-size:1.25rem;padding-bottom:4px}
.q .ar,.opt .ar{font-size:1.25em}
.arl{font-size:1.18rem;line-height:1.95;text-align:right}.arl .table th,.arl .table td{text-align:right}.arl ul,.arl ol{padding-right:1.3em;padding-left:0}
.arsub{font-family:'Noto Naskh Arabic',serif;color:var(--ink-3);font-size:1rem;direction:rtl}
.track{display:flex;gap:8px;margin-top:4px}
.track button{flex:1;text-align:left;border:1.5px solid var(--line);border-radius:16px;padding:12px;background:var(--card);min-height:70px}
.track button.on{border-color:var(--baobab);background:var(--baobab-soft)}
.track b{display:block}
.track span{font-size:.82rem;color:var(--ink-3)}
.tabs2{display:flex;gap:6px;margin:4px 0 14px}
.tabs2 button{flex:1;min-height:44px;border-radius:12px;font-weight:700;border:1.5px solid var(--line);background:var(--card)}
.tabs2 button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
</style>
</head>
<body>
<div id="root"></div>
<script src="contenu/cm2-maths.js"></script>
<script src="contenu/cm2-francais.js"></script><script src="contenu/3e-maths.js"></script><script src="contenu/3e-francais.js"></script><script src="contenu/cm2-eveil.js"></script><script src="contenu/3e-sciences.js"></script><script src="contenu/3e-societe.js"></script><script src="contenu/tle-sciences.js"></script><script src="contenu/tle-lettres.js"></script><script src="contenu/elem-base.js"></script><script src="contenu/moyen-base.js"></script><script src="contenu/lycee-base.js"></script><script src="contenu/elem-eveil.js"></script><script src="contenu/moyen-autres.js"></script><script src="contenu/lycee-autres.js"></script><script src="contenu/lycee-serie-L.js"></script><script src="contenu/quiz-plus-1.js"></script><script src="contenu/quiz-plus-2.js"></script><script src="contenu/arabe.js"></script>
<script>
/* ============================================================
   Sunu Jàng 2.0 — app connectée (Supabase) + mode démo
   Profils : Élève · Parent · Enseignant · École
   ============================================================ */

// ---------- icônes ----------
const ICONS={
 home:'<path d="M3 10.5 12 3l9 7.5V21h-7v-6h-4v6H3z"/>',
 book:'<path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/>',
 quiz:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><circle cx="12" cy="17.3" r=".7" fill="currentColor"/>',
 award:'<circle cx="12" cy="9" r="6"/><path d="M8.5 14 7 22l5-3 5 3-1.5-8"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
 chart:'<path d="M4 20V11M10 20V5M16 20v-8M21 20H3"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 wallet:'<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/>',
 msg:'<path d="M4 5h16v11H9l-5 4z"/>',
 check:'<path d="m5 12 5 5 9-10"/>',

const LESSONS={
'elem|Mathématiques|0':{dur:8,html:`<p>Une <b>fraction</b> représente une partie d'un tout partagé en parts égales.</p>
<div class="ex"><b>Exemple :</b> Awa coupe un pain de mil en 4 parts égales. Elle en mange 3. Elle a mangé <b>3/4</b> du pain.</div>
<h4>Les mots à retenir</h4><ul><li>Le nombre du haut est le <b>numérateur</b> : les parts prises.</li><li>Le nombre du bas est le <b>dénominateur</b> : le nombre total de parts.</li></ul>
<h4>Calculer une fraction d'un nombre</h4><p>Pour trouver 3/4 de 20 : on divise par le dénominateur, puis on multiplie par le numérateur.</p>
<div class="box">20 ÷ 4 = 5, puis 5 × 3 = <b>15</b>. Donc 3/4 de 20 = 15.</div>
<h4>À toi</h4><p>Un commerçant a 30 mangues. Il vend 2/3 de ses mangues. Combien en a-t-il vendu ? <i>(Réponse : 30 ÷ 3 × 2 = 20 mangues)</i></p>`},
'elem|Histoire|2':{dur:7,html:`<p>À la fin du XIXe siècle, plusieurs hommes et femmes se sont opposés à la conquête coloniale française.</p>
<h4>Lat Dior Ngoné Latyr Diop</h4><p>Damel (roi) du Cayor, il refuse la construction du chemin de fer Dakar–Saint-Louis. Il meurt au combat à <b>Dékheulé en 1886</b>.</p>
<h4>Aline Sitoé Diatta</h4><p>Héroïne de Casamance, elle appelle la population à refuser les réquisitions de riz pendant la Seconde Guerre mondiale. Arrêtée et déportée, elle meurt à Tombouctou en 1944.</p>
<h4>Autres figures</h4><ul><li><b>El Hadji Omar Tall</b> : chef religieux et militaire.</li><li><b>Alboury Ndiaye</b> : dernier Bourba du Djolof.</li></ul>
<div class="box">Retiens : ces résistants sont aujourd'hui des symboles de courage et de dignité pour tout le Sénégal.</div>`},
'moyen|Mathématiques|0':{dur:10,html:`<p>Le <b>théorème de Thalès</b> permet de calculer des longueurs quand deux droites parallèles coupent deux droites sécantes.</p>
<h4>Énoncé</h4><div class="box">Si les points A, M, B et A, N, C sont alignés dans le même ordre et si (MN) // (BC), alors : <b>AM/AB = AN/AC = MN/BC</b></div>
<h4>Exemple</h4><div class="ex">AM = 3 cm, AB = 6 cm, BC = 8 cm et (MN) // (BC).<br>AM/AB = MN/BC donc 3/6 = MN/8, soit MN = 8 × 3 ÷ 6 = <b>4 cm</b>.</div>
<h4>Méthode en 3 étapes</h4><ol><li>Vérifier l'alignement et le parallélisme.</li><li>Écrire l'égalité des trois rapports.</li><li>Faire un produit en croix.</li></ol>
<p>Ce chapitre tombe très souvent au <b>BFEM</b>.</p>`},
'moyen|SVT|0':{dur:8,html:`<p>La <b>digestion</b> transforme les aliments en nutriments que le sang peut transporter.</p>
<h4>Le trajet des aliments</h4><ol><li><b>Bouche</b> : mastication et salive (début de la digestion de l'amidon).</li><li><b>Œsophage</b> puis <b>estomac</b> : brassage et suc gastrique.</li><li><b>Intestin grêle</b> : fin de la digestion et <b>absorption</b> des nutriments.</li><li><b>Gros intestin</b> : absorption de l'eau, formation des selles.</li></ol>
<div class="box">Les enzymes sont des substances qui découpent les grosses molécules en petites molécules.</div>`},
'moyen|Français|0':{dur:6,html:`<p>Pour rapporter les paroles de quelqu'un, on utilise le discours direct ou le discours indirect.</p>
<h4>Discours direct</h4><div class="ex">Le maître dit : « Je corrigerai vos copies demain. »</div>
<h4>Discours indirect</h4><div class="ex">Le maître dit <b>qu'il corrigera</b> nos copies le lendemain.</div>
<h4>Ce qui change</h4><ul><li>Les guillemets disparaissent, on ajoute « que ».</li><li>Les pronoms changent (je → il).</li><li>Les indications de temps changent (demain → le lendemain).</li><li>Si le verbe introducteur est au passé, les temps changent : futur → conditionnel.</li></ul>`},
'lycee|Philosophie|0':{dur:9,html:`<p>Le mot <b>philosophie</b> vient du grec <i>philein</i> (aimer) et <i>sophia</i> (sagesse) : l'amour de la sagesse.</p>
<h4>Une attitude</h4><p>Philosopher, c'est s'étonner, douter et chercher à comprendre par la raison plutôt que d'accepter les opinions toutes faites.</p>
<div class="box">Socrate : « Tout ce que je sais, c'est que je ne sais rien. »</div>
<h4>Philosophie en Afrique</h4><p>Des penseurs comme <b>Cheikh Anta Diop</b>, <b>Souleymane Bachir Diagne</b> ou <b>Paulin Hountondji</b> ont nourri le débat sur la place de la pensée africaine.</p>
<h4>Pour la dissertation</h4><ul><li>Définir les termes du sujet.</li><li>Dégager le problème.</li><li>Construire un plan qui avance.</li></ul>`},
'lycee|Mathématiques|0':{dur:10,html:`<p>Une <b>suite numérique</b> est une liste de nombres u₀, u₁, u₂… indexée par les entiers naturels.</p>
<h4>Suite arithmétique</h4><div class="box">u<sub>n+1</sub> = u<sub>n</sub> + r &nbsp;→&nbsp; u<sub>n</sub> = u₀ + n·r</div>
<h4>Suite géométrique</h4><div class="box">u<sub>n+1</sub> = q·u<sub>n</sub> &nbsp;→&nbsp; u<sub>n</sub> = u₀·qⁿ</div>
<div class="ex"><b>Exemple :</b> un élève épargne 500 F la 1re semaine puis 200 F de plus chaque semaine. u₀ = 500, r = 200, donc u₁₀ = 500 + 10 × 200 = <b>2 500 F</b>.</div>`},

Object.assign(LESSONS,{
'ar|Nahw|0':{dur:7,html:`<p>En arabe, tout mot (<b>الكلمة</b>) appartient à l'une de trois catégories.</p>
<span class="ar" lang="ar">الكلمةُ ثلاثةُ أقسامٍ: اسمٌ، وفعلٌ، وحرفٌ.</span><span class="tr">Le mot a trois catégories : le nom, le verbe et la particule.</span>
<table><tr><td class="ar" lang="ar">الاسم</td><td>Le <b>nom</b> : personne, chose, lieu…</td><td class="ar" lang="ar">كِتَابٌ، مَدْرَسَةٌ، دَاكَار</td></tr>
<tr><td class="ar" lang="ar">الفعل</td><td>Le <b>verbe</b> : une action liée au temps</td><td class="ar" lang="ar">كَتَبَ، يَقْرَأُ، اِجْلِسْ</td></tr>
<tr><td class="ar" lang="ar">الحرف</td><td>La <b>particule</b> : n'a de sens qu'avec un autre mot</td><td class="ar" lang="ar">فِي، مِنْ، إِلَى، عَلَى</td></tr></table>
<div class="box"><b>Astuce :</b> le nom accepte « ال » et le tanwîn (كتابٌ). Le verbe accepte « قد » ou « سـ » (سيكتبُ).</div>
<div class="ex"><b>Exercice :</b> classe les mots de la phrase : <span class="ar" lang="ar">ذَهَبَ التِّلْمِيذُ إِلَى الْمَدْرَسَةِ</span>ذَهَبَ = verbe · التلميذ = nom · إلى = particule · المدرسة = nom.</div>`},
'ar|Nahw|1':{dur:7,html:`<p>La <b>phrase nominale</b> (الجملة الاسمية) commence par un nom. Elle a deux parties : le <b>mubtada'</b> (sujet) et le <b>khabar</b> (attribut).</p>
<span class="ar" lang="ar">الْمُبْتَدَأُ وَالْخَبَرُ مَرْفُوعَانِ.</span><span class="tr">Le mubtada' et le khabar sont au cas nominatif (marfû').</span>
<div class="ex"><span class="ar" lang="ar">الْعِلْمُ نُورٌ</span><span class="tr">La science est une lumière. العلمُ = mubtada' · نورٌ = khabar.</span></div>
<div class="ex"><span class="ar" lang="ar">الْمُعَلِّمُ حَاضِرٌ</span><span class="tr">Le maître est présent.</span></div>
<div class="box">Le signe du nominatif au singulier est la <b>damma</b> ( ـُ ).</div>`},
'ar|Sarf|0':{dur:6,html:`<p>Le <b>fi\'l mâdî</b> (الفعل الماضي) exprime une action terminée. Voici le verbe <span class="ar" lang="ar" style="display:inline;font-size:1.2em">كَتَبَ</span> (écrire) :</p>
<table>${[['أَنَا','كَتَبْتُ','J\'ai écrit'],['أَنْتَ','كَتَبْتَ','Tu as écrit (m.)'],['أَنْتِ','كَتَبْتِ','Tu as écrit (f.)'],['هُوَ','كَتَبَ','Il a écrit'],['هِيَ','كَتَبَتْ','Elle a écrit'],['نَحْنُ','كَتَبْنَا','Nous avons écrit'],['أَنْتُمْ','كَتَبْتُمْ','Vous avez écrit'],['هُمْ','كَتَبُوا','Ils ont écrit']].map(r=>`<tr><td class="ar" lang="ar">${r[0]}</td><td class="ar" lang="ar">${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table>
<div class="box">Toutes les terminaisons s'ajoutent à la racine <b>ك ت ب</b>.</div>`},
'ar|Coran & Tajwîd|2':{dur:8,html:`<p>Le <b>noun sâkin</b> (نْ) et le <b>tanwîn</b> (ـًـٍـٌ) suivent quatre règles selon la lettre qui vient après.</p>
<table><tr><td class="ar" lang="ar">الإظهار</td><td><b>Prononcer clairement</b> devant les 6 lettres de la gorge : ء هـ ع ح غ خ</td></tr>
<tr><td class="ar" lang="ar">الإدغام</td><td><b>Fusionner</b> devant les lettres du mot <span lang="ar" class="ar" style="display:inline">يَرْمَلُونَ</span></td></tr>
<tr><td class="ar" lang="ar">الإقلاب</td><td><b>Transformer</b> en mîm devant la lettre ب</td></tr>
<tr><td class="ar" lang="ar">الإخفاء</td><td><b>Cacher</b> (nasaliser) devant les 15 autres lettres</td></tr></table>
<div class="ex"><b>Exemples :</b><span class="ar" lang="ar">مِنْ هَادٍ (إظهار) · مِنْ بَعْدِ (إقلاب) · مَنْ يَقُولُ (إدغام) · مِنْ كُلِّ (إخفاء)</span></div>`},
'ar|Hadith|0':{dur:6,html:`<div class="verse"><span class="ar" lang="ar">عَنْ عُمَرَ بْنِ الْخَطَّابِ رَضِيَ اللَّهُ عَنْهُ قَالَ: سَمِعْتُ رَسُولَ اللَّهِ ﷺ يَقُولُ: «إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى»</span><p class="muted">رواه البخاري ومسلم · Rapporté par Al-Bukhârî et Muslim</p></div>
<h4>Traduction</h4><p>« Les actes ne valent que par les intentions, et chacun n'aura que ce qu'il a eu l'intention de faire. »</p>
<h4>Ce que nous apprenons</h4><ul><li>Avant d'agir, on vérifie pourquoi on le fait.</li><li>Une action ordinaire (étudier, aider ses parents) devient une bonne œuvre avec une bonne intention.</li><li>Ce hadith ouvre de nombreux recueils, comme le livre des 40 hadiths d'An-Nawawî.</li></ul>`},
'ar|Qisas al-anbiyâ|1':{dur:6,html:`<span class="ar" lang="ar">أَرْسَلَ اللَّهُ نُوحًا عَلَيْهِ السَّلَامُ إِلَى قَوْمِهِ يَدْعُوهُمْ إِلَى عِبَادَةِ اللَّهِ وَحْدَهُ.</span><span class="tr">Allah envoya Noé (Nûh) à son peuple pour l'appeler à adorer Allah seul.</span>
<h4>L'histoire</h4><ul><li>Nûh appelle son peuple pendant très longtemps : le Coran parle de « mille ans moins cinquante ».</li><li>Peu de gens le croient. Allah lui ordonne de construire une grande <b>arche</b> (السفينة).</li><li>Il y fait monter les croyants et un couple de chaque espèce.</li><li>Le <b>déluge</b> (الطوفان) arrive ; les croyants sont sauvés.</li></ul>
<div class="box"><b>Leçon :</b> la patience et la persévérance dans le bien.</div>`},

async function api(fn,args){
 const r=await fetch(SB.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
 const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null}catch(e){}
 if(!r.ok)throw new Error((j&&(j.message||j.hint))||('Erreur serveur '+r.status));return j}
const KINDS=['classes','eleves','notes','absences','paiements','devoirs','comportement','messages','sondages','annonces','inscriptions','votes'];
const itemId=(k,o)=>k==='absences'?o.eleve+'|'+o.date:k==='paiements'?o.eleve+'|'+o.mois:o.id;
const strip=o=>{const c={...o};delete c._e;return c};
function espOf(k,o){if(o._e)return o._e;const d=S.data;
 if(o.classe){const c=d.classes.find(x=>x.id===o.classe);if(c&&c._e)return c._e}
 if(o.eleve){const e=d.eleves.find(x=>x.id===o.eleve);if(e&&e._e)return e._e}
 if(o.sondage){const s=d.sondages.find(x=>x.id===o.sondage);if(s&&s._e)return s._e}
 return S.espace}
function flatten(){const out={};const d=S.data;
 for(const k of KINDS)for(const o of (d[k]||[])){const id=itemId(k,o);const e=espOf(k,o);if(!id||!e)continue;o._e=e;out[e+'|'+k+'|'+id]={kind:k,id,espace:e,data:strip(o)}}
 return out}

async function pushNow(){
 if(!S.live||!S.keys.length)return true;if(pushing){pushAgain=true;return false}
 const f=flatten();const ch=[];
 for(const k in f){const j=JSON.stringify(f[k].data);if(S._sync[k]!==j)ch.push({key:k,j,it:f[k]})}
 for(const k in S._sync)if(!f[k]){const [e,kind,...rest]=k.split('|');ch.push({key:k,del:true,it:{kind,id:rest.join('|'),espace:e,data:{},deleted:true}})}
 if(!ch.length)return true;if(navigator.onLine===false){setNet();return false}
 // les classes d'abord (elles enregistrent les codes), puis les élèves, puis le reste
 const ord={classes:0,eleves:1};ch.sort((a,b)=>(ord[a.it.kind]??2)-(ord[b.it.kind]??2));

 try{for(let i=0;i<ch.length;i+=150){const part=ch.slice(i,i+150);
   const res=await api('sj_push',{p_keys:S.keys,p_items:part.map(c=>c.it)});
   const bad=new Set((res.rejected||[]).map(r=>r.kind+'|'+r.id));
   for(const c of part){const kk=c.it.kind+'|'+c.it.id;if(bad.has(kk))denied++;
    if(c.del)delete S._sync[c.key];else S._sync[c.key]=c.j}}
  try{localStorage.setItem('sunujang2',JSON.stringify(S))}catch(e){}
  if(denied)toast(denied+' modification(s) refusée(s) : vous n\'avez pas les droits','x');
  return true}
 catch(e){return false}

 const res=await api('sj_pull',{p_keys:S.keys});
 const d=emptyData(BLANK_SCHOOL());d.resultats=(S.data&&S.data.resultats)||[];d.codes=(S.data&&S.data.codes)||d.codes;

// Moyenne d'une matière = (moyenne des devoirs + 2 × composition) / 3 (usage courant au Sénégal)
function moyMatiere(eleveId,mat,per=1){
 const ns=S.data.notes.filter(n=>n.eleve===eleveId&&n.matiere===mat&&n.periode===per);
 const dv=ns.filter(n=>n.type==='devoir').map(n=>n.note), cp=ns.filter(n=>n.type==='compo').map(n=>n.note);
 const md=dv.length?dv.reduce((a,b)=>a+b,0)/dv.length:null, mc=cp.length?cp.reduce((a,b)=>a+b,0)/cp.length:null;
 if(md==null&&mc==null)return {md,mc,moy:null};
 const moy=mc==null?md:md==null?mc:(md+2*mc)/3;return {md,mc,moy};
}
function bulletin(eleveId,per=1){
 const e=S.data.eleves.find(x=>x.id===eleveId);const c=S.data.classes.find(x=>x.id===e.classe);
 let tot=0,coefs=0;const lignes=c.matieres.map(([m,coef])=>{const r=moyMatiere(eleveId,m,per);if(r.moy!=null){tot+=r.moy*coef;coefs+=coef}return {m,coef,...r}});
 const moy=coefs?tot/coefs:null;
 const all=S.data.eleves.filter(x=>x.classe===c.id).map(x=>({id:x.id,m:moyGen(x.id,per)})).filter(x=>x.m!=null).sort((a,b)=>b.m-a.m);
 const rang=all.findIndex(x=>x.id===eleveId)+1;
 return {e,c,lignes,moy,rang,effectif:all.length,mention:mention(moy,c.bareme),classMoy:all.length?all.reduce((a,b)=>a+b.m,0)/all.length:null};
}
function moyGen(id,per=1){const e=S.data.eleves.find(x=>x.id===id);const c=S.data.classes.find(x=>x.id===e.classe);let t=0,k=0;for(const [m,coef] of c.matieres){const r=moyMatiere(id,m,per);if(r.moy!=null){t+=r.moy*coef;k+=coef}}return k?t/k:null}
function mention(m,b){if(m==null)return '';const x=m/b*20;return x>=16?'Félicitations':x>=14?'Encouragements':x>=12?'Tableau d\'honneur':x>=10?'Passable':'Doit redoubler d\'efforts'}
const rangTxt=r=>!r?'—':r===1?'1er':r+'e';
function absCount(id){const a=S.data.absences.filter(x=>x.eleve===id);return {abs:a.filter(x=>x.statut==='absent').length,ret:a.filter(x=>x.statut==='retard').length,tot:a.length}}

function sheet(html){closeSheet();const d=document.createElement('div');d.className='scrim';d.id='scrim';d.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;d.addEventListener('click',e=>{if(e.target===d)closeSheet()});document.body.appendChild(d);const f=d.querySelector('input,textarea,button');f&&f.focus()}
function closeSheet(){const d=$('#scrim');d&&d.remove()}
let tT;function toast(m,ic='check'){const old=$('.toast');old&&old.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.innerHTML=I(ic,18)+esc(m);document.body.appendChild(d);clearTimeout(tT);tT=setTimeout(()=>d.remove(),2600)}
function speak(txt){try{const s=window.speechSynthesis;if(!s)return toast('Lecture vocale non disponible sur cet appareil','x');s.cancel();const clean=txt.replace(/<[^>]+>/g,' ');const ar=(clean.match(/[\u0600-\u06FF]/g)||[]).length,la=(clean.match(/[a-zA-Zéèà]/g)||[]).length;const u=new SpeechSynthesisUtterance(clean);u.lang=ar>la?'ar-SA':'fr-FR';u.rate=.95;s.speak(u);toast('Lecture en cours…','volume')}catch(e){toast('Lecture vocale non disponible','x')}}
async function copyTxt(txt){try{await navigator.clipboard.writeText(txt);toast('Copié — colle-le dans WhatsApp')}catch(e){sheet(`<h3>Copier le texte</h3><p class="muted">Sélectionne et copie :</p><textarea class="input" style="min-height:220px">${esc(txt)}</textarea>`)}}

 <label class="f">Économie de données</label><div class="seg"><button class="${!S.saver?'on':''}" onclick="S.saver=false;save();sheetSettings()">Désactivée</button><button class="${S.saver?'on':''}" onclick="S.saver=true;save();sheetSettings()">Activée</button></div>

 <div class="stats"><div class="stat"><b>${st.streak} j</b><span>Série</span></div><div class="stat"><b>${st.points}</b><span>Points</span></div><div class="stat"><b>${Object.keys(st.done).length}</b><span>Leçons lues</span></div></div>

 ${cs?`<div class="sec-title">Reprendre</div><button class="card row" style="width:100%;text-align:left" onclick="openV('lesson',{cy:'${cy}',s:'${cs}',i:${ci}})">${mono(cs)}<div class="grow"><div class="t" style="font-weight:700">${chTitle(CHAPTERS[chKey(cy,cs)][ci])}</div><div class="muted">${cs} · ${LESSONS[cont].dur} min de lecture</div><div class="bar"><i style="width:${st.done[cont]?100:35}%"></i></div></div>${I('chev',18)}</button>`:''}
 ${dv.length?`<div class="sec-title">Mes devoirs <small>${esc((S.data.classes.find(c=>c.id===st.classe)||{}).nom||'')}</small></div><div class="list">${dv.slice(0,3).map(d=>`<div class="item">${mono(d.matiere,40)}<div class="grow"><div class="t">${esc(d.titre)}</div><div class="muted">Pour le ${dLabel(d.limite)}</div></div></div>`).join('')}</div>`:
  `<div class="sec-title">Ma classe</div><div class="card"><b>Relie ton compte à ta classe</b><p class="muted">Avec le code de ton enseignant, tu verras tes devoirs et tes notes ici.</p><div class="spacer"></div><button class="btn small ghost" onclick="sheetJoin()">Entrer un code</button></div>`}
 <div class="sec-title">Matières <small>${lvl.id} · ${CYCLE_NAME[cy]}</small></div>
 <div class="grid2">${(st.fil==='fa'?subs.filter(isAr).slice(0,4):subs.slice(0,4)).map(s=>`<button class="tile" onclick="openV('subject',{s:'${esc(s)}'})">${mono(s)}<div class="t">${subjLabel(s)}</div><span class="muted">${(CHAPTERS[chKey(cy,s)]||[]).length} chapitres</span></button>`).join('')}</div>

function sheetJoin(){sheet(`<h3>Rejoindre ma classe</h3><label class="f" for="jc">Code de classe</label><input class="input" id="jc" placeholder="Ex. CM2A-7KX3P" autocapitalize="characters"><div class="spacer"></div><button class="btn block" onclick="joinClass($('#jc').value)">Rejoindre</button>`)}
async function joinClass(v){const code=String(v||'').trim().toUpperCase();if(!code)return toast('Entre le code','x');
 if(!S.live){const c=S.data.classes.find(x=>x.code===code);if(!c)return toast('Code introuvable','x');S.student.classe=c.id;S.student.niveau=c.niveau;S.user.sub='Élève · '+c.nom;save();closeSheet();render();return toast('Bienvenue en '+c.nom)}
 wait(true);const old=S.keys.filter(k=>(S.kinfo.find(i=>i.cle===k)||{}).role==='student');
 const k=await addKey(code);wait(false);
 if(!k||k.role!=='student'){S.keys=S.keys.filter(x=>x!==code||old.includes(x));return toast('Code introuvable. Vérifie avec ton enseignant.','x')}
 S.keys=S.keys.filter(x=>x===code||!old.includes(x));await pullNow({force:true}).catch(()=>{});
 const c=S.data.classes.find(x=>x.id===k.classe);if(c){S.student.niveau=c.niveau;if(c.fil)S.student.fil=c.fil}buildUser();save();closeSheet();render();toast('Bienvenue en '+(c?c.nom:'classe'))}

 const body=L?L.html:`<p>Le contenu complet de ce chapitre est en cours de rédaction par l'équipe pédagogique.</p><div class="box">En attendant, entraîne-toi avec le quiz de ${esc(v.s)} : il couvre les notions principales de ton niveau.</div>`;

function stQuizHome(){

 return `<section class="hero">${WAX()}<h2>Entraîne-toi en 2 minutes</h2><p>Questions corrigées et expliquées, adaptées au niveau ${S.student.niveau}.</p><button class="btn" onclick="startQuiz('${cy}','__mix',8)">${I('quiz',20)}Quiz mélangé</button></section>

 <div class="sec-title">Mes derniers résultats</div>${hist.length?`<div class="list">${hist.map(r=>`<div class="item">${mono(r.matiere==='Défi du jour'||r.matiere==='Mélangé'?'Mathématiques':r.matiere,38)}<div class="grow"><div class="t">${esc(r.matiere)}</div><div class="muted">${esc(r.date)}</div></div><span class="badge ${r.pct>=70?'ok':r.pct>=50?'warn':'bad'}">${r.score}/${r.total}</span></div>`).join('')}</div>`:`<div class="card empty">Aucun quiz pour l'instant. Lance ton premier quiz ci-dessus.</div>`}`;

function startQuiz(cy,subj,n){
 let pool;
 if(subj==='__defi'||subj==='__mix'){pool=subjectsFor(cy,S.student.fil).flatMap(s=>bankFor(cy,s).map(q=>[...q,s]))}else pool=bankFor(cy,subj).map(q=>[...q,subj]);
 const uniq=[...new Map(pool.map(q=>[q[0],q])).values()];
 const qs=uniq.sort(()=>Math.random()-.5).slice(0,n).map(q=>{const order=q[1].map((_,i)=>i).sort(()=>Math.random()-.5);return {q:q[0],c:order.map(i=>q[1][i]),a:order.indexOf(q[2]),e:q[3],s:q[4]}});
 S.view={name:'quiz',fn:VIEWS.quiz,hideNav:true,qs,i:0,score:0,picked:null,label:subj==='__defi'?'Défi du jour':subj==='__mix'?'Mélangé':subj};
 render();scrollTo(0,0);
}

  <div class="sec-title">Correction</div><div class="list">${v.qs.map(q=>`<div class="item"><div class="av" style="background:${q.ok?'var(--ok)':'var(--bad)'};color:#fff">${I(q.ok?'check':'x',18)}</div><div class="grow"><div class="t" dir="auto">${esc(q.q)}</div><div class="muted" dir="auto">Réponse : ${esc(q.c[q.a])}</div></div></div>`).join('')}</div>
  <div class="spacer"></div><div class="btns"><button class="btn" onclick="back()">Terminer</button><button class="btn ghost" onclick="copyTxt('Sunu Jàng · '+'${esc(v.label)}'+' : j\\'ai eu ${v.score}/${v.qs.length} ! Essaie de me battre 💪')">Partager</button></div>`;
 }

 return `<header class="top"><button class="iconbtn" aria-label="Quitter le quiz" onclick="back()">${I('x')}</button><div class="qprog grow" role="progressbar" aria-valuenow="${v.i+1}" aria-valuemax="${v.qs.length}"><i style="width:${(v.i+(p!=null?1:0))/v.qs.length*100}%"></i></div><span class="badge">${v.i+1}/${v.qs.length}</span></header>
 <main style="padding-bottom:30px"><div class="row">${mono(q.s,32)}<span class="muted">${esc(q.s)}</span><button class="speak" style="margin-left:auto" onclick="speak(${esc(JSON.stringify(q.q+'. '+q.c.join('. ')))})" aria-label="Écouter la question">${I('volume')}</button></div>

 </main>`;

 if(!el.length)return clsSwitch()+`<section class="hero">${WAX()}<p style="margin:0;opacity:.85">${esc(c.nom)} · ${c.niveau}${c.fil==='fa'?' · franco-arabe':''}</p><h2>Ajoutez vos élèves</h2><p>Puis donnez le code de classe <b>${c.code}</b> aux élèves et le code parent à chaque famille.</p><button class="btn" onclick="sheetAddEleve()">${I('plus',20)}Ajouter un élève</button></section><div class="spacer"></div><div class="card row"><div class="grow"><div style="font-family:var(--display);font-size:1.5rem;font-weight:800">${c.code}</div><div class="muted">Code de la classe</div></div><button class="btn small ghost" onclick="copyTxt('Rejoins la classe ${esc(c.nom)} sur Sunu Jàng avec le code ${c.code}')">${I('copy',18)}Copier</button></div><div class="spacer"></div><button class="btn ghost block" onclick="sheetNewClass()">${I('plus',20)}Créer une autre classe</button>`;const d=S.data.absences.filter(a=>a.classe===c.id&&a.date===lastDay());const pres=d.filter(a=>a.statut!=='absent').length;
 const moys=el.map(e=>moyGen(e.id)).filter(x=>x!=null);const cm=moys.reduce((a,b)=>a+b,0)/moys.length;
 const weak=el.map(e=>({e,m:moyGen(e.id)})).filter(x=>x.m!=null&&x.m/c.bareme<.5).sort((a,b)=>a.m-b.m);
 const done=S.data.absences.some(a=>a.classe===c.id&&a.date===todayISO());
 return clsSwitch()+`<section class="hero">${WAX()}<p style="margin:0;opacity:.85">${c.nom} · ${el.length} élèves</p><h2>${done?'Appel fait. Bonne journée !':'L\'appel du jour n\'est pas encore fait'}</h2>
 <div class="stats"><div class="stat"><b>${fmt(cm)}</b><span>Moy. classe</span></div><div class="stat"><b>${Math.round(pres/(d.length||1)*100)} %</b><span>Présence</span></div><div class="stat"><b>${S.data.devoirs.filter(x=>x.classe===c.id).length}</b><span>Devoirs</span></div></div>
 <button class="btn" onclick="go('call')">${I('check',20)}${done?'Revoir l\'appel':'Faire l\'appel'}</button></section>
 <div class="sec-title">Actions rapides</div><div class="grid2">
 ${[['clip','Saisir des notes',"go('notes')"],['book','Donner un devoir',"sheetDevoir()"],['star','Noter le comportement',"openV('behaviour')"],['msg','Messages parents',"openV('teMsgs')"]].map(([ic,l,f])=>`<button class="tile" onclick="${f}"><div class="mono" style="background:var(--baobab-soft);color:var(--baobab)">${I(ic)}</div><div class="t">${l}</div></button>`).join('')}</div>
 ${weak.length?`<div class="sec-title">Élèves à accompagner <small>moyenne sous ${c.bareme/2}</small></div><div class="list">${weak.slice(0,4).map(x=>`<div class="item"><div class="av" style="background:#F8E0DD;color:var(--bad)">${initials(x.e.nom)}</div><div class="grow"><div class="t">${esc(x.e.nom)}</div></div><b style="color:var(--bad)">${fmt(x.m)}</b></div>`).join('')}</div>`:''}`;
}
function lastDay(){const ds=[...new Set(S.data.absences.map(a=>a.date))].sort();return ds[ds.length-1]}
function teCall(){
 const c=cls();const el=S.data.eleves.filter(e=>e.classe===c.id);const day=todayISO();
 if(!S._call||S._call.cls!==c.id){const ex=S.data.absences.filter(a=>a.classe===c.id&&a.date===day);S._call={cls:c.id,map:Object.fromEntries(el.map(e=>[e.id,(ex.find(a=>a.eleve===e.id)||{}).statut||'present']))}}
 const m=S._call.map;const n=Object.values(m);
 return clsSwitch()+`<div class="row"><div class="grow"><div class="sec-title" style="margin:0">Appel · ${dLabel(day)}</div><div class="muted">P = présent · A = absent · R = retard</div></div></div>
 <div class="row" style="gap:8px;margin:10px 0"><span class="badge ok">${n.filter(x=>x==='present').length} présents</span><span class="badge bad">${n.filter(x=>x==='absent').length} absents</span><span class="badge warn">${n.filter(x=>x==='retard').length} retards</span></div>
 <div class="list">${el.map(e=>`<div class="roll"><div class="av">${initials(e.nom)}</div><div class="grow"><b>${esc(e.nom)}</b></div><div class="tri" role="group" aria-label="Statut de ${esc(e.nom)}">${[['p','present','P'],['a','absent','A'],['r','retard','R']].map(([k,v,l])=>`<button class="${k} ${m[e.id]===v?'on':''}" aria-pressed="${m[e.id]===v}" onclick="S._call.map['${e.id}']='${v}';render()">${l}</button>`).join('')}</div></div>`).join('')}</div>
 <div class="spacer"></div><button class="btn block" onclick="saveCall()">${I('check',20)}Enregistrer l'appel</button><p class="muted" style="margin-top:8px;text-align:center">Les parents des absents sont prévenus automatiquement.</p>`;
}
function saveCall(){const c=cls();const day=todayISO();S.data.absences=S.data.absences.filter(a=>!(a.classe===c.id&&a.date===day));for(const [id,st] of Object.entries(S._call.map))S.data.absences.push({eleve:id,classe:c.id,date:day,statut:st});const nAbs=Object.values(S._call.map).filter(x=>x==='absent').length;save();toast('Appel enregistré'+(nAbs?' · '+nAbs+' parent'+(nAbs>1?'s':'')+' prévenu'+(nAbs>1?'s':''):''));go('home')}
function teNotes(){
 const c=cls();const el=S.data.eleves.filter(e=>e.classe===c.id);
 S._n=S._n&&S._n.cls===c.id?S._n:{cls:c.id,mat:c.matieres[0][0],type:'devoir',vals:{}};const n=S._n;
 return clsSwitch()+`<div class="sec-title" style="margin-top:0">Saisie des notes <small>sur ${c.bareme}</small></div>
 <label class="f" for="nm">Matière</label><select class="input" id="nm" onchange="S._n.mat=this.value;S._n.vals={};render()">${c.matieres.map(([m])=>`<option ${m===n.mat?'selected':''}>${esc(m)}</option>`).join('')}</select>
 <label class="f">Type</label><div class="seg"><button class="${n.type==='devoir'?'on':''}" onclick="S._n.type='devoir';render()">Devoir</button><button class="${n.type==='compo'?'on':''}" onclick="S._n.type='compo';render()">Composition</button></div>
 <div class="spacer"></div><div class="list">${el.map((e,i)=>`<div class="roll"><div class="av">${initials(e.nom)}</div><div class="grow"><b>${esc(e.nom)}</b><div class="muted">Moy. actuelle : ${fmt(moyMatiere(e.id,n.mat).moy)}</div></div><input class="noteIn" inputmode="decimal" aria-label="Note de ${esc(e.nom)}" placeholder="—" value="${n.vals[e.id]??''}" oninput="S._n.vals['${e.id}']=this.value" onkeydown="if(event.key==='Enter'){const x=document.querySelectorAll('.noteIn')[${i+1}];x&&x.focus()}"></div>`).join('')}</div>
 <div class="spacer"></div><button class="btn block" onclick="saveNotes()">${I('check',20)}Enregistrer les notes</button>`;
}
function saveNotes(){const c=cls();const n=S._n;let k=0,bad=0;for(const [id,v] of Object.entries(n.vals)){if(v===''||v==null)continue;const x=parseFloat(String(v).replace(',','.'));if(isNaN(x)||x<0||x>c.bareme){bad++;continue}S.data.notes.push({id:uid(),eleve:id,classe:c.id,matiere:n.mat,type:n.type,periode:1,note:x,date:todayISO()});k++}
 if(bad)return toast(bad+' note(s) invalide(s) : entre un nombre entre 0 et '+c.bareme,'x');if(!k)return toast('Saisis au moins une note','x');S._n.vals={};save();render();toast(k+' notes enregistrées · parents informés')}
function teBulletins(){
 const c=cls();const el=S.data.eleves.filter(e=>e.classe===c.id).map(e=>({e,m:moyGen(e.id)})).sort((a,b)=>(b.m??-1)-(a.m??-1));
 return clsSwitch()+`<div class="sec-title" style="margin-top:0">Bulletins · Semestre 1 <small>calcul automatique</small></div>
 <div class="list">${el.map((x,i)=>`<button class="item" onclick="openV('bull',{id:'${x.e.id}'})"><div class="av" style="${i<3?'background:var(--mango);color:var(--ink)':''}">${i+1}</div><div class="grow"><div class="t">${esc(x.e.nom)}</div><div class="muted">${mention(x.m,c.bareme)}</div></div><b>${fmt(x.m)}</b>${I('chev',18)}</button>`).join('')}</div>
 <p class="muted" style="margin-top:10px">Coefficients : ${c.matieres.map(([m,k])=>m+' '+k).join(', ')}.</p>`;
}

VIEWS.behaviour=v=>{const c=cls();const el=S.data.eleves.filter(e=>e.classe===c.id);return backbar('Comportement',c.nom)+`<div class="list">${el.map(e=>{const p=S.data.comportement.filter(x=>x.eleve===e.id);return `<div class="roll"><div class="av">${initials(e.nom)}</div><div class="grow"><b>${esc(e.nom)}</b><div class="muted">${p.filter(x=>x.type==='positif').length} positif · ${p.filter(x=>x.type==='negatif').length} à revoir</div></div><div class="tri"><button class="p" aria-label="Positif pour ${esc(e.nom)}" onclick="sheetBeh('${e.id}','positif')">+</button><button class="a" aria-label="À revoir pour ${esc(e.nom)}" onclick="sheetBeh('${e.id}','negatif')">−</button></div></div>`}).join('')}</div>`};

function sheetDevoir(){const c=cls();sheet(`<h3>Nouveau devoir · ${c.nom}</h3><label class="f" for="dm">Matière</label><select class="input" id="dm">${c.matieres.map(([m])=>`<option>${esc(m)}</option>`).join('')}</select><label class="f" for="dt">Consigne</label><input class="input" id="dt" placeholder="Ex. Exercices 1 à 4 page 58"><label class="f" for="dd">Détails (facultatif)</label><textarea class="input" id="dd"></textarea><label class="f" for="dl">Pour le</label><input class="input" type="date" id="dl" value="${new Date(Date.now()+3*864e5).toISOString().slice(0,10)}"><div class="spacer"></div>
 <button class="btn block" onclick="const t=$('#dt').value.trim();if(!t)return toast('Écris la consigne','x');S.data.devoirs.push({id:uid(),classe:'${c.id}',matiere:$('#dm').value,titre:t,desc:$('#dd').value,limite:$('#dl').value});save();closeSheet();render();toast('Devoir publié pour les élèves et les parents')">Publier le devoir</button>`)}
function sheetNewClass(){sheet(`<h3>Nouvelle classe</h3><label class="f" for="ncn">Nom</label><input class="input" id="ncn" placeholder="Ex. CE2 B"><label class="f" for="ncl">Niveau</label>${levelSelect('ncl','CE2')}<label class="f" for="ncf">Type</label><select class="input" id="ncf"><option value="classique">Classique</option><option value="fa">Franco-arabe</option></select><div class="spacer"></div><button class="btn block" onclick="const n=$('#ncn').value.trim();if(!n)return toast('Donne un nom à la classe','x');const c=newClass(n,$('#ncl').value,S.user.prenom,$('#ncf').value,(cls()||{})._e);S.user.classes=S.user.classes||[];S.user.classes.push(c.id);S.user.cls=c.id;save();closeSheet();go('home');toast('Classe créée · code élèves '+c.code)">Créer</button>`)}

 const c=cls();const el=S.data.eleves.filter(e=>e.classe===c.id);
 return clsSwitch()+`<div class="list">${[['plus','Créer une classe',"sheetNewClass()"],['book','Devoirs',"openV('teDevoirs')"],['star','Comportement',"openV('behaviour')"],['msg','Messages parents',"openV('teMsgs')"],['users','Élèves et codes parents',"openV('teEleves')"]].map(([ic,l,f])=>`<button class="item" onclick="${f}"><div class="av">${I(ic,18)}</div><div class="grow t">${l}</div>${I('chev',18)}</button>`).join('')}</div>

 ${c.cleProf?`<div class="sec-title">Votre code enseignant</div><div class="card row"><div class="grow"><div style="font-family:var(--display);font-size:1.3rem;font-weight:800;letter-spacing:.04em">${esc(c.cleProf)}</div><div class="muted">Pour vous reconnecter sur un autre téléphone. Ne le donnez pas aux élèves.</div></div><button class="btn small ghost" onclick="copyTxt('${esc(c.cleProf)}')">${I('copy',18)}</button></div>`:''}`;
}

function diHome(){
 const d=S.data;const nE=d.eleves.length;const pend=d.inscriptions.filter(i=>i.statut==='en_attente').length;
 const ld=lastDay();const dAbs=d.absences.filter(a=>a.date===ld);const pres=dAbs.length?Math.round(dAbs.filter(a=>a.statut!=='absent').length/dAbs.length*100):0;
 const nov=d.paiements.filter(p=>p.mois==='Nov');const novPaid=nov.filter(p=>p.paye).length;
 const enc=d.paiements.filter(p=>p.paye).length*d.school.frais;
 return `<section class="hero">${WAX()}<p style="margin:0;opacity:.85">${esc(d.school.nom)}</p><h2>${pend?pend+' inscription'+(pend>1?'s':'')+' à valider':'Tout est à jour'}</h2>
 <div class="stats"><div class="stat"><b>${nE}</b><span>Élèves</span></div><div class="stat"><b>${d.classes.length}</b><span>Classes</span></div><div class="stat"><b>${pres} %</b><span>Présence</span></div></div>
 ${pend?`<button class="btn" onclick="go('inscr')">Voir les demandes</button>`:''}</section>
 <div class="sec-title">Finances <small>année 2026-2027</small></div>
 <div class="kpis"><div class="kpi"><span>Encaissé</span><b style="font-size:1.35rem">${fcfa(enc)}</b></div><div class="kpi"><span>Novembre payé</span><b>${nov.length?Math.round(novPaid/nov.length*100):0} %</b><div class="bar"><i style="width:${nov.length?novPaid/nov.length*100:0}%"></i></div></div></div>
 ${d.classes.length?'':`<div class="sec-title">Pour bien démarrer</div><div class="list">${[['school','Créer vos classes',"go('classes')"],['key','Donner le code de classe à chaque enseignant',"go('classes')"],['users','Partager le lien d\'inscription aux parents',"go('inscr')"]].map(([ic,l,f],i)=>`<button class="item" onclick="${f}"><div class="av">${i+1}</div><div class="grow t">${l}</div>${I('chev',18)}</button>`).join('')}</div>`}

 <div class="sec-title">Communiquer</div><div class="grid2"><button class="tile" onclick="sheetAnnonce()"><div class="mono" style="background:var(--baobab-soft);color:var(--baobab)">${I('megaphone')}</div><div class="t">Envoyer une annonce</div></button><button class="tile" onclick="sheetSondage()"><div class="mono" style="background:var(--baobab-soft);color:var(--baobab)">${I('vote')}</div><div class="t">Créer un sondage</div></button></div>`;
}

 <p class="muted" style="margin-top:8px">Parent : ${esc(i.parent)} · ${esc(i.tel)}${i.tel?` · <a href="https://wa.me/221${esc(String(i.tel).replace(/\D/g,'').replace(/^221/,''))}" target="_blank" rel="noopener">WhatsApp</a>`:''}<br>Paiement : ${i.ref?'<b>'+esc(i.ref)+'</b>':'<span style="color:var(--bad)">aucune référence</span>'}</p>
 ${i.statut==='en_attente'?`<div class="btns" style="margin-top:10px"><button class="btn small" onclick="inscr('${i.id}',true)">${I('check',18)}Accepter</button><button class="btn small danger" onclick="inscr('${i.id}',false)">Refuser</button></div>`:i.code?`<p style="margin-top:8px">Code parent envoyé par SMS : <b>${i.code}</b></p>`:''}</div>`}).join('')}</div>
 <div class="sec-title">Lien d'inscription en ligne</div><div class="card row"><div class="grow"><b>sunujang.org/i/${d.school.code.toLowerCase()}</b><div class="muted">À partager sur WhatsApp ou Facebook</div></div><button class="btn small ghost" onclick="copyTxt('Inscrivez votre enfant au ${esc(d.school.nom)} : https://sunujang.org/i/${d.school.code.toLowerCase()}')">${I('copy',18)}</button></div>`;
}
function inscr(id,ok){const i=S.data.inscriptions.find(x=>x.id===id);i.statut=ok?'acceptee':'refusee';if(ok){if(!i.classe||!S.data.classes.find(c=>c.id===i.classe)){const c=S.data.classes.find(x=>x.niveau===i.niveau)||newClass(i.niveau+' A',i.niveau,'À attribuer','classique');i.classe=c.id}const e=addEleve({classe:i.classe,nom:i.enfant});i.code=e.codeParent}save();render();toast(ok?'Inscription acceptée · le parent voit son code dans l\'app':'Inscription refusée · le parent le verra dans l\'app')}
function diClasses(){
 const d=S.data;
 return `<div class="sec-title" style="margin-top:6px">Classes</div><button class="btn block" onclick="sheetClasse()">${I('plus',20)}Créer une classe</button><div class="spacer"></div>
 <div class="list">${d.classes.map(c=>`<div class="item"><div class="mono" style="background:var(--ink)">${c.niveau}</div><div class="grow"><div class="t">${c.nom}</div><div class="muted">${esc(c.prof)} · notes sur ${c.bareme}<br>Code élèves <b>${esc(c.code)}</b>${c.cleProf?' · code enseignant <b>'+esc(c.cleProf)+'</b>':''}</div></div>${c.cleProf?`<button class="iconbtn" aria-label="Copier pour l'enseignant" onclick="copyTxt('Bonjour, voici votre accès Sunu Jàng pour la classe ${esc(c.nom)} : ouvrez https://sunujang.org, choisissez Enseignant puis « J\\'ai un code » et entrez ${esc(c.cleProf)}')">${I('copy',18)}</button>`:''}</div>`).join('')||'<div class="empty">Aucune classe pour l\'instant.</div>'}</div>
 <div class="sec-title">Enseignants</div><div class="list">${[...new Set(d.classes.map(c=>c.prof))].map(p=>`<div class="item"><div class="av">${initials(p.replace(/^(M\.|Mme) /,''))}</div><div class="grow"><div class="t">${esc(p)}</div><div class="muted">${d.classes.filter(c=>c.prof===p).map(c=>c.nom).join(', ')}</div></div></div>`).join('')}</div>`;
}
function sheetClasse(){sheet(`<h3>Nouvelle classe</h3><label class="f" for="cn">Nom</label><input class="input" id="cn" placeholder="Ex. 6e A"><label class="f" for="cl">Niveau</label><select class="input" id="cl">${LEVELS.map(l=>`<option>${l.id}</option>`).join('')}</select><label class="f" for="cf">Type</label><select class="input" id="cf"><option value="classique">Classique</option><option value="fa">Franco-arabe</option></select><label class="f" for="cp">Enseignant principal</label><input class="input" id="cp" placeholder="Ex. Mme Fall"><div class="spacer"></div>
 <button class="btn block" onclick="const n=$('#cn').value.trim(),p=$('#cp').value.trim(),l=$('#cl').value;if(!n||!p)return toast('Remplis le nom et l\\'enseignant','x');const c=newClass(n,l,p,$('#cf').value);save();closeSheet();render();toast(c.cleProf?'Classe créée · code enseignant '+c.cleProf:'Classe créée · code '+c.code)">Créer</button>`)}
function diPay(){
 const d=S.data;const mo=d.mois;
 return `<div class="sec-title" style="margin-top:6px">Paiements <small>${fcfa(d.school.frais)}/mois</small></div>
 <div class="card" style="overflow-x:auto;padding:12px"><table class="table"><thead><tr><th>Classe</th>${mo.slice(0,4).map(m=>`<th style="text-align:right">${m}</th>`).join('')}</tr></thead><tbody>
 ${d.classes.map(c=>{const el=d.eleves.filter(e=>e.classe===c.id);return `<tr><td><b>${c.nom}</b></td>${mo.slice(0,4).map(m=>{const ps=d.paiements.filter(p=>p.mois===m&&el.some(e=>e.id===p.eleve));const k=ps.filter(p=>p.paye).length;return `<td class="n">${k}/${el.length}</td>`}).join('')}</tr>`}).join('')}</tbody></table></div>
 <div class="sec-title">Retards de paiement · Novembre</div><div class="list">${d.eleves.filter(e=>!(d.paiements.find(p=>p.eleve===e.id&&p.mois==='Nov')||{}).paye).slice(0,8).map(e=>`<div class="item"><div class="av">${initials(e.nom)}</div><div class="grow"><div class="t">${esc(e.nom)}</div><div class="muted">${esc((d.classes.find(c=>c.id===e.classe)||{}).nom||'')}</div></div><button class="btn small ghost" onclick="copyTxt('Bonjour, la mensualité de novembre de ${esc(e.nom)} (${fcfa(d.school.frais)}) n\\'est pas encore réglée. Merci. — ${esc(d.school.nom)}')">Relancer</button></div>`).join('')}</div>
 <div class="spacer"></div><button class="btn block mango" onclick="toast('Rappels envoyés à tous les parents en retard')">${I('send',20)}Relancer tout le monde</button>`;
}
function diMore(){
 const d=S.data;const sd=d.sondages;
 return `<div class="sec-title" style="margin-top:6px">Sondages</div>${sd.map(s=>{const R=sdCount(s);const tot=Object.values(R).reduce((a,b)=>a+b,0);return `<div class="card"><b>${esc(s.question)}</b>${[['oui','Oui'],['non','Non'],['peut_etre','Peut-être']].map(([k,l])=>`<div style="margin-top:10px"><div class="row"><span class="grow">${l}</span><b>${R[k]}</b></div><div class="bar"><i style="width:${tot?R[k]/tot*100:0}%"></i></div></div>`).join('')}<p class="muted" style="margin-top:8px">${tot} réponses</p></div>`}).join('<div class="spacer"></div>')}
 <div class="spacer"></div><button class="btn ghost block" onclick="sheetSondage()">${I('plus',20)}Nouveau sondage</button>
 <div class="sec-title">Annonces envoyées</div><div class="stack">${d.annonces.map(a=>`<div class="card"><b>${esc(a.titre)}</b><p class="muted">${esc(a.txt)}</p></div>`).join('')}</div>
 <div class="sec-title">Établissement</div><div class="list"><div class="item"><div class="av">${I('school',18)}</div><div class="grow"><div class="t">${esc(d.school.nom)}</div><div class="muted">${esc(d.school.ville)}</div></div></div><div class="item"><div class="av">${I('wallet',18)}</div><div class="grow"><div class="t">Mensualité</div><div class="muted">${fcfa(d.school.frais)} · Wave ${d.school.wave}</div></div></div><div class="item"><div class="av">${I('key',18)}</div><div class="grow"><div class="t">Code établissement</div><div class="muted">${esc(d.school.code)} · à donner aux parents pour les inscriptions</div></div></div>${S.live?`<button class="item" onclick="sheetCodes()"><div class="av">${I('lock',18)}</div><div class="grow"><div class="t">Code direction</div><div class="muted">Votre code de connexion secret</div></div>${I('chev',18)}</button>`:''}</div>`;
}
function sheetAnnonce(){sheet(`<h3>Annonce à tous les parents</h3><label class="f" for="at">Titre</label><input class="input" id="at"><label class="f" for="ax">Message</label><textarea class="input" id="ax"></textarea><p class="muted" style="margin-top:6px">Envoyée dans l'app et par SMS aux parents sans smartphone.</p><div class="spacer"></div><button class="btn block" onclick="const t=$('#at').value.trim(),x=$('#ax').value.trim();if(!t||!x)return toast('Remplis le titre et le message','x');S.data.annonces.unshift({id:uid(),titre:t,txt:x,date:todayISO(),_e:S.espace});save();closeSheet();render();toast('Annonce envoyée')">Envoyer</button>`)}
function sheetSondage(){sheet(`<h3>Nouveau sondage</h3><label class="f" for="sq">Question</label><textarea class="input" id="sq" placeholder="Ex. Êtes-vous d'accord pour des cours de renforcement le samedi ?"></textarea><p class="muted" style="margin-top:6px">Les parents répondent Oui, Non ou Peut-être.</p><div class="spacer"></div><button class="btn block" onclick="const q=$('#sq').value.trim();if(!q)return toast('Écris la question','x');S.data.sondages.forEach(s=>s.actif=false);S.data.sondages.unshift({id:uid(),question:q,actif:true,date:todayISO(),_e:S.espace});save();closeSheet();render();toast('Sondage publié')">Publier</button>`)}

// ---------- parent sans enfant lié / ajout d'un enfant ----------
function paEmpty(){
 const pend=(S.user.pending||[]).map(id=>S.data.inscriptions.find(i=>i.id===id)).filter(Boolean);
 return `<section class="hero">${WAX()}<h2>Ajoutez votre enfant</h2><p>Pour voir ses notes, ses absences, ses devoirs et payer la scolarité.</p><button class="btn" onclick="sheetAddKid()">${I('plus',20)}Ajouter mon enfant</button></section>
 ${pend.length?`<div class="sec-title">Mes demandes d'inscription</div><div class="list">${pend.map(i=>`<div class="item"><div class="av">${initials(i.enfant)}</div><div class="grow"><div class="t">${esc(i.enfant)}</div><div class="muted">${esc(i.ecole||S.data.school.nom)} · ${esc(i.niveau)}</div></div>${i.statut==='acceptee'?`<button class="btn small" onclick="linkKid('${i.code}')">Suivre</button>`:i.statut==='refusee'?'<span class="badge bad">Refusée</span>':'<span class="badge warn">En attente</span>'}</div>`).join('')}</div>`:''}
 <div class="sec-title">En attendant</div><div class="list">
 <button class="item" onclick="S.role='student';S.user=null;save();render()"><div class="av">${I('book',18)}</div><div class="grow"><div class="t">Faire réviser votre enfant</div><div class="muted">Cours et quiz gratuits du CI à la Terminale</div></div>${I('chev',18)}</button>
 <button class="item" onclick="copyTxt('Bonjour, notre école peut s\\'inscrire gratuitement sur Sunu Jàng pour les notes, absences et paiements : https://sunujang.org/ecole')"><div class="av">${I('school',18)}</div><div class="grow"><div class="t">Votre école n'est pas sur Sunu Jàng ?</div><div class="muted">Envoyez-lui l'invitation par WhatsApp</div></div>${I('copy',18)}</button></div>`;
}
async function linkKid(code){code=String(code||'').trim().toUpperCase();if(!code)return toast('Entrez le code parent','x');
 if(S.live){wait(true);const k=await addKey(code);wait(false);if(!k||k.role!=='parent'){S.keys=S.keys.filter(x=>x!==code);return toast('Code parent introuvable. Vérifiez auprès de l\'école.','x')}
  buildUser();S.user.kid=k.eleve;save();closeSheet();go('home');const e=S.data.eleves.find(x=>x.id===k.eleve);return toast((e?e.nom:'Enfant')+' ajouté')}
 const ks=S.data.eleves.filter(e=>e.codeParent===code);if(!ks.length)return toast('Code parent introuvable. Vérifiez auprès de l\'école.','x');ks.forEach(k=>{if(!S.user.kids.includes(k.id))S.user.kids.push(k.id)});S.user.kid=ks[0].id;S.user.sub='Parent · '+S.user.kids.map(id=>S.data.eleves.find(e=>e.id===id).nom.split(' ')[0]).join(', ');save();closeSheet();go('home');toast(ks[0].nom+' ajouté')}
async function lookupSchool(v){const code=String(v||'').trim().toUpperCase();const box=$('#ksinfo');if(!code){S._sch=null;box&&(box.innerHTML='');return}
 try{const r=await api('sj_school_info',{p_code:code});S._sch=r;S._invite=code;if(!r){box.innerHTML='<p class="muted" style="color:var(--bad)">Aucune école avec ce code.</p>';return}
  const sc=r.school||{};box.innerHTML=`<div class="card" style="margin-top:10px;background:var(--baobab-soft);border-color:#BFDCCD"><b>${esc(sc.nom)}</b><div class="muted">${esc(sc.ville||'')}</div>${sc.frais?`<p class="muted" style="margin-top:6px;color:var(--ink-2)">Mensualité ${fcfa(sc.frais)}${sc.wave&&sc.wave!=='—'?' · paiement Wave / Orange Money au '+esc(sc.wave):''}</p>`:''}</div>`}
 catch(e){box.innerHTML='<p class="muted" style="color:var(--bad)">Impossible de vérifier le code (connexion ?).</p>'}}
function sheetAddKid(mode='code'){
 const sc=S.data.school;
 if(S.live&&mode==='inscr'){
  sheet(`<h3>Ajouter mon enfant</h3><div class="tabs2" style="margin-top:10px"><button onclick="sheetAddKid('code')">J'ai un code parent</button><button class="on">L'inscrire à l'école</button></div>
  <label class="f" for="ksc">Code de l'école</label><input class="input" id="ksc" placeholder="Ex. PIONNIER42" autocapitalize="characters" value="${esc(S._invite||'')}" onchange="lookupSchool(this.value)"><p class="muted" style="margin-top:6px">Demandez-le à l'école, ou ouvrez le lien d'inscription qu'elle a partagé.</p><div id="ksinfo"></div>
  <label class="f" for="kn">Prénom et nom de l'enfant</label><input class="input" id="kn"><div class="grid2"><div><label class="f" for="ka">Âge</label><input class="input" id="ka" inputmode="numeric"></div><div><label class="f" for="kl">Classe demandée</label>${levelSelect('kl','CM2')}</div></div>
  <label class="f" for="kr">Référence du paiement (facultatif)</label><input class="input" id="kr" placeholder="Ex. WV-88213">
  <div class="spacer"></div><button class="btn block" onclick="sendInscr()">Envoyer la demande</button>`);
  if(S._invite)lookupSchool(S._invite);return}
 sheet(`<h3>Ajouter mon enfant</h3><div class="tabs2" style="margin-top:10px"><button class="${mode==='code'?'on':''}" onclick="sheetAddKid('code')">J'ai un code parent</button><button class="${mode==='inscr'?'on':''}" onclick="sheetAddKid('inscr')">L'inscrire à l'école</button></div>
 ${mode==='code'?`<p class="muted">Le code parent est sur la fiche d'inscription, ou demandez-le à l'enseignant.</p><label class="f" for="kc">Code parent</label><input class="input" id="kc" placeholder="Ex. PAR-4100" autocapitalize="characters"><div class="spacer"></div><button class="btn block" onclick="linkKid($('#kc').value.trim().toUpperCase())">Ajouter</button>`:
 `<label class="f" for="ks">École</label><select class="input" id="ks"><option>${esc(sc.nom)} — ${esc(sc.ville)}</option></select>
 <label class="f" for="kn">Prénom et nom de l'enfant</label><input class="input" id="kn"><div class="grid2"><div><label class="f" for="ka">Âge</label><input class="input" id="ka" inputmode="numeric"></div><div><label class="f" for="kl">Classe demandée</label>${levelSelect('kl','CM2')}</div></div>
 ${sc.frais?`<div class="card" style="margin-top:14px;background:var(--mango-soft);border-color:#F3D9A6"><b>Frais d'inscription</b><p class="muted" style="color:var(--ink-2)">Payez par Wave ou Orange Money au ${esc(sc.wave)}, puis collez la référence. Vous pouvez aussi payer sur place.</p></div><label class="f" for="kr">Référence du paiement (facultatif)</label><input class="input" id="kr" placeholder="Ex. WV-88213">`:''}
 <div class="spacer"></div><button class="btn block" onclick="sendInscr()">Envoyer la demande</button>`}`);
}
async function sendInscr(){const n=$('#kn').value.trim();if(!n)return toast('Indiquez le nom de l\'enfant','x');const lv=$('#kl').value;
 if(S.live){const code=($('#ksc')||{value:''}).value.trim().toUpperCase();if(!code)return toast('Entrez le code de l\'école','x');
  wait(true);try{const info=S._sch&&S._sch.code===code?S._sch:await api('sj_school_info',{p_code:code});if(!info){wait(false);return toast('Aucune école avec ce code','x')}
   const c=(info.classes||[]).find(x=>x.niveau===lv);
   const r=await api('sj_inscrire',{p_code:code,p_data:{enfant:n,age:parseInt($('#ka').value)||'',niveau:lv,classe:c?c.id:null,parent:S.user.nom||S.user.prenom,tel:S.user.tel||'',ref:($('#kr')||{value:''}).value.trim(),ecole:(info.school||{}).nom||''}});
   S.keys.push(r.token);await pullNow({force:true});S._invite=null;buildUser();save();closeSheet();render();toast('Demande envoyée à l\'école')}
  catch(e){toast('Envoi impossible. Vérifiez votre connexion.','x')}finally{wait(false)}return}
 const c=S.data.classes.find(x=>x.niveau===lv);
 const i={id:uid(),enfant:n,age:parseInt($('#ka').value)||'',niveau:lv,classe:c?c.id:null,parent:S.user.prenom,tel:S.user.tel||'',ref:($('#kr')||{value:''}).value.trim(),statut:'en_attente',date:todayISO(),ecole:S.data.school.nom};
 S.data.inscriptions.unshift(i);S.user.pending=[...(S.user.pending||[]),i.id];save();closeSheet();render();toast('Demande envoyée à l\'école')}
const P=f=>()=>S.user.kids&&S.user.kids.length&&kid()?f():paEmpty();
const TC=f=>()=>cls()?f():`<section class="hero">${WAX()}<h2>Aucune classe</h2><p>Créez votre classe, ou connectez-vous avec le code enseignant donné par la direction.</p><button class="btn" onclick="sheetNewClass()">${I('plus',20)}Créer une classe</button></section>`;

// ---------- rôles ----------
const ROLES={
 student:{tabs:[{id:'home',icon:'home',label:'home',fn:stHome},{id:'courses',icon:'book',label:'courses',fn:stCourses},{id:'quiz',icon:'quiz',label:'quiz',fn:stQuizHome},{id:'exams',icon:'award',label:'exams',fn:stExams},{id:'me',icon:'user',label:'me',fn:stMe}]},
 parent:{tabs:[{id:'home',icon:'home',label:'home',fn:P(paHome)},{id:'notes',icon:'chart',label:'notes',fn:P(paNotes)},{id:'school',icon:'school',label:'school',fn:P(paSchool)},{id:'pay',icon:'wallet',label:'pay',fn:P(paPay)},{id:'msgs',icon:'msg',label:'msgs',fn:P(paMsgs)}]},
 teacher:{tabs:[{id:'home',icon:'home',label:'home',fn:TC(teHome)},{id:'call',icon:'check',label:'call',fn:TC(teCall)},{id:'notes',icon:'clip',label:'notes',fn:TC(teNotes)},{id:'bulletins',icon:'chart',label:'bulletins',fn:TC(teBulletins)},{id:'more',icon:'grid',label:'more',fn:TC(teMore)}]},
 director:{tabs:[{id:'home',icon:'chart',label:'dash',fn:diHome},{id:'inscr',icon:'users',label:'inscr',fn:diInscr},{id:'classes',icon:'school',label:'classes',fn:diClasses},{id:'pay',icon:'wallet',label:'pay',fn:diPay},{id:'more',icon:'grid',label:'more',fn:diMore}]}};

// liens partagés : sunujang.org/i/CODE (inscription) et sunujang.org/ecole
(function(){const q=new URLSearchParams(location.search);const path=q.get('p')||location.pathname;
 const m=path.match(/^\/i\/([A-Za-z0-9-]{3,20})/);if(m){S._invite=m[1].toUpperCase();if(!S.user){S.role='parent';S.loginMode='new'}}
 else if(/^\/ecole/.test(path)&&!S.user){S.role='director';S.loginMode='new'}
 if(q.get('p')||m)history.replaceState(null,'','/')})();
restoreView();
if(S.role&&S.user&&!ROLES[S.role].tabs.find(x=>x.id===S.tab))S.tab='home';
addEventListener('online',()=>{render();refresh()});addEventListener('offline',()=>setNet());
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
setInterval(refresh,60000);
if(S.live&&S.keys.length)setTimeout(refresh,300);
if(S._invite&&S.user&&S.role==='parent')setTimeout(()=>sheetAddKid('inscr'),400);
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
render();
</script>
</body>
</html>
